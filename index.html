<script>
let characteristic;

// Sử dụng đúng định dạng UUID 128-bit để khớp với ESP32
const SERVICE_UUID = "00001234-0000-1000-8000-00805f9b34fb";
const CHARACTERISTIC_UUID = "00005678-0000-1000-8000-00805f9b34fb";

async function connect() {
    try {
        console.log("Đang tìm thiết bị...");
        const device = await navigator.bluetooth.requestDevice({
            // Lọc theo Service UUID để tìm đúng Robot của bạn
            filters: [{ services: [SERVICE_UUID] }]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.querySelector('.btn-connect').innerText = "ĐÃ KẾT NỐI ✓";
        document.querySelector('.btn-connect').style.borderColor = "#00ff88";
        document.querySelector('.btn-connect').style.color = "#00ff88";
        
        console.log("Kết nối thành công!");
    } catch (error) {
        console.error("Lỗi: ", error);
        alert("Chưa kết nối được Bluetooth! Chi tiết: " + error);
    }
}

function send(cmd) {
    if (!characteristic) {
        console.log("Chưa kết nối Bluetooth!");
        return;
    }
    
    // Chuyển ký tự thành mảng byte để gửi đi
    let data = new TextEncoder().encode(cmd);
    characteristic.writeValue(data)
        .then(() => console.log("Đã gửi: " + cmd))
        .catch(err => console.log("Lỗi gửi tin: " + err));
}

// Ngăn chặn menu chuột phải khi nhấn giữ trên mobile (giữ nguyên của bạn)
window.oncontextmenu = function(event) {
     event.preventDefault();
     event.stopPropagation();
     return false;
};
</script>
